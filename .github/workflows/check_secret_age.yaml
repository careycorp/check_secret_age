name: Check Access Token Age

on:
  workflow_dispatch:
  #schedule:
  #  - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/check_secret_age.yaml'

permissions: read-all

jobs:
  check-secret-age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        id: gh_app_token
        with:
          app-id: ${{ vars.APP_CHECK_AGE_ID }}
          private-key: ${{ secrets.APP_CHECK_AGE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Get Secret last updated time
        env:
          GH_TOKEN: ${{ steps.gh_app_token.outputs.token }}
        run: |
          updated_at=$(curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/orgs/careycorp/actions/secrets/TEST_SECRET | jq '.updated_at')
          
          if [[ $(date -d "$updated_at" +%s) -gt $(date -d '20 minutes ago' +%s) ]]; then
            echo "Secret is updated within the last 20 minutes."
          else
            echo "Secret is older than 20 minutes."
            echo "Send notification to Slack or email here."
          fi
          echo "SecretAge: $updated_at"
