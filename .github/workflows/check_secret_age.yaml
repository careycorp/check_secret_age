name: Check Access Token Age

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/check_secret_age.yaml'

permissions: read-all

env:
  BANNER_MESSAGE: "**GH Issue:** Org Secret Rotation Impacted, TF Modules may be affected"
  TEAMS_THRESHOLD: 20 # minutes
  BANNER_THRESHOLD: 40 # minutes

jobs:
  check-secret-age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@29824e69f54612133e76f7eaac726eef6c875baf # v2.2.1
        id: gh_app_token
        with:
          app-id: ${{ vars.APP_CHECK_AGE_ID }}
          private-key: ${{ secrets.APP_CHECK_AGE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Get Secret last updated time
        id: check_secret
        env:
          GH_TOKEN: ${{ steps.gh_app_token.outputs.token }}
          SECRET_NAME: GH_ACCESS_CONFIG
        run: |
          set -euo pipefail

          response=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/orgs/${{ github.repository_owner }}/actions/secrets/$SECRET_NAME)

          updated_at=$(echo "$response" | jq -r '.updated_at')

          updated_seconds=$(date -d "$updated_at" +%s)
          now_seconds=$(date +%s)

          age=$(( (now_seconds - updated_seconds) / 60 ))

          echo "Secret Age is: $age minutes"

          echo "age=$age" >> $GITHUB_OUTPUT

      - name: Alert Teams if Secret is older than threshold
        if: steps.check_secret.outputs.age > env.TEAMS_THRESHOLD
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.INFENG_WEBHOOK_URL }}
          SECRET_AGE: ${{ steps.check_secret.outputs.age }}
        run: |
          set -euo pipefail

          body=$(jq -n \
            --arg age "$SECRET_AGE" \
            '{
              type: "message",
              attachments: [{
                contentType: "application/vnd.microsoft.card.adaptive",
                content: {
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  type: "AdaptiveCard",
                  version: "1.5",
                  body: [
                    {
                      type: "TextBlock",
                      text: "🚨 GH_ACCESS_CONFIG Token Rotation Alert",
                      weight: "Bolder",
                      size: "Large",
                      color: "Attention"
                    },
                    {
                      type: "TextBlock",
                      text: ("GH_ACCESS_CONFIG secret rotated " + $age + " minutes ago. TF Modules may be affected."),
                      wrap: true
                    },
                    {
                      type: "FactSet",
                      facts: [
                        { title: "SecretAge", value: ($age + " minutes") },
                        { title: "Action", value: "Review Workflow" }
                      ]
                    }
                  ]
                }
              }]
            }')

          curl -sL \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$body" \
            "$TEAMS_WEBHOOK_URL"

      - name: Check existing Banner Status
        id: current_banner
        env:
          GH_TOKEN: ${{ steps.gh_app_token.outputs.token }}
          BANNER_MESSAGE: ${{ env.BANNER_MESSAGE }}
        run: |
          set -euo pipefail

          status="false"
          announcement=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/orgs/${{ github.repository_owner }}/announcement | jq -r '.announcement // empty')

          if [[ $announcement == "${BANNER_MESSAGE}" ]]; then
            echo "Existing banner detected: $announcement"
            status="true"
          fi

          echo "status=$status" >> $GITHUB_OUTPUT

      - name: Create Banner if Secret is over banner threshold and no existing banner
        if: steps.current_banner.outputs.status == 'false' && steps.check_secret.outputs.age > env.BANNER_THRESHOLD
        env:
          GH_TOKEN: ${{ steps.gh_app_token.outputs.token }}
          BANNER_MESSAGE: ${{ env.BANNER_MESSAGE }}
        run: |
          set -euo pipefail

          expires_at=$(date -d '+1 day' --utc +%Y-%m-%dT%H:%M:%SZ)

          curl -sL \
            -X PATCH \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/orgs/${{ github.repository_owner }}/announcement \
            -d '{"announcement":"'"${BANNER_MESSAGE}"'", "expires_at":"'"$expires_at"'"}'

      - name: Remove Banner if Secret is updated and banner exists
        if: steps.current_banner.outputs.status == 'true' && steps.check_secret.outputs.age < env.TEAMS_THRESHOLD
        env:
          GH_TOKEN: ${{ steps.gh_app_token.outputs.token }}
        run: |
          set -euo pipefail

          curl -sL \
            -X DELETE \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            https://api.github.com/orgs/${{ github.repository_owner }}/announcement
